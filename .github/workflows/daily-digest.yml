name: Daily AI Product Radar

on:
  schedule:
    - cron: "53 23 * * *"  # UTC 23:53 = Beijing 07:53, avoids GitHub's top-of-hour schedule queue
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send this run by email (off generates a preview only)"
        type: boolean
        default: false
  push:
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/daily-digest.yml'

concurrency:
  group: daily-ai-product-radar-${{ github.ref_name }}-${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_email) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  send-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout dailyinput config
        uses: actions/checkout@v6
        with:
          path: dailyinput

      - name: Checkout TrendRadar
        uses: actions/checkout@v6
        with:
          repository: sansan0/TrendRadar
          ref: 792bcc3928b1617bba09df34989fd5675c159b86
          path: TrendRadar

      - name: Apply custom config
        run: |
          cp dailyinput/config/config.yaml TrendRadar/config/config.yaml
          cp dailyinput/config/frequency_words.txt TrendRadar/config/frequency_words.txt
          cp dailyinput/config/ai_interests.txt TrendRadar/config/ai_interests.txt
          cp dailyinput/config/ai_analysis_prompt.txt TrendRadar/config/ai_analysis_prompt.txt
          cp dailyinput/config/ai_translation_prompt.txt TrendRadar/config/ai_translation_prompt.txt
          python dailyinput/scripts/apply_topic_patch.py TrendRadar

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Builders feed
        run: |
          python dailyinput/scripts/builders_jsonfeed.py \
            --output TrendRadar/tmp/builders-feed/builders.json \
            --max-age-days 3
          python -m http.server 8765 \
            --bind 127.0.0.1 \
            --directory TrendRadar/tmp/builders-feed \
            > /tmp/builders-feed.log 2>&1 &
          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:8765/builders.json >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/builders-feed.log || true
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        working-directory: TrendRadar
        run: uv sync --frozen --no-dev

      - name: Test unified topic selection and rendering
        working-directory: dailyinput
        env:
          TRENDRADAR_ROOT: ${{ github.workspace }}/TrendRadar
        run: ../TrendRadar/.venv/bin/python -m unittest discover -s tests -v

      - name: Run TrendRadar
        working-directory: TrendRadar
        env:
          AI_ANALYSIS_ENABLED: "true"
          AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY }}
          AI_MODEL: "deepseek/deepseek-v4-flash"
          EMAIL_FROM: "1441469055@qq.com"
          EMAIL_TO: "1441469055@qq.com"
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD || secrets.QQ_AUTH_CODE }}
          EMAIL_SMTP_SERVER: "smtp.qq.com"
          EMAIL_SMTP_PORT: "465"
          GITHUB_ACTIONS: "true"
          SEND_EMAIL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_email) }}
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "::error::Missing AI_API_KEY or DEEPSEEK_API_KEY secret"
            exit 1
          fi
          if [ "$SEND_EMAIL" = "true" ] && [ -z "$EMAIL_PASSWORD" ]; then
            echo "::error::Missing EMAIL_PASSWORD or QQ_AUTH_CODE secret"
            exit 1
          fi
          uv run python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          path = Path("config/config.yaml")
          config = yaml.safe_load(path.read_text())
          config["notification"]["enabled"] = os.environ["SEND_EMAIL"] == "true"
          path.write_text(yaml.safe_dump(config, allow_unicode=True, sort_keys=False))
          PY
          uv run python -m trendradar

      - name: Upload digest preview and selection audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dailyinput-preview-${{ github.run_id }}
          path: |
            TrendRadar/output/html/latest/current.html
            TrendRadar/output/topic-selection.json
          retention-days: 7
          if-no-files-found: warn
