app:
  timezone: "Asia/Shanghai"
  show_version_update: false

schedule:
  enabled: false
  preset: "custom"

platforms:
  enabled: true
  sources:
    # ---- 产品 / 技术 ----
    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"
    - id: "github-trending-today"
      name: "GitHub Trending"
      expected_domain: "github.com"
    # ---- 金融 / 宏观 / 政策（带解读）----
    - id: "wallstreetcn-news"
      name: "华尔街见闻文章"
      expected_domain: "wallstreetcn.com"
    - id: "cls-depth"
      name: "财联社深度"
      expected_domain: "cls.cn"

rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 2
  feeds:
    # ---- OpenAI 官网 ----
    - id: "openai"
      name: "OpenAI News"
      url: "https://openai.com/news/rss.xml"
      max_age_days: 5
    - id: "openai-research"
      name: "OpenAI Research"
      url: "https://raw.githubusercontent.com/0xSMW/rss-feeds/main/feeds/feed_openai_research.xml"
      # 研究分栏平均每周 1-2 篇，窗口小于 3 周会经常整栏为空。
      max_age_days: 21
    - id: "openai-alignment"
      name: "OpenAI Alignment"
      url: "https://raw.githubusercontent.com/0xSMW/rss-feeds/main/feeds/feed_openai_alignment.xml"
      # 对齐研究更稀疏，实测相邻两篇间隔可达 1-3 周。
      max_age_days: 45

    # ---- Anthropic 官网 ----
    - id: "anthropic"
      name: "Anthropic News"
      url: "https://raw.githubusercontent.com/0xSMW/rss-feeds/main/feeds/feed_anthropic_news.xml"
      # 官网新闻更新很慢；5 天窗口曾把最新一篇（第 5.4 天）整栏挡掉。
      max_age_days: 14
    - id: "anthropic-research"
      name: "Anthropic Research"
      url: "https://raw.githubusercontent.com/0xSMW/rss-feeds/main/feeds/feed_anthropic_research.xml"
      max_age_days: 14

    # ---- 其他 AI 官方与产品线 ----
    - id: "google-ai"
      name: "Google AI Blog"
      url: "https://blog.google/technology/ai/rss/"
      # 官方博客约每周 1 篇，5 天窗口长期只剩 1 条。
      max_age_days: 10
    - id: "product-hunt"
      name: "Product Hunt"
      url: "https://www.producthunt.com/feed"
      max_age_days: 2
    - id: "builders"
      name: "AI Builders"
      url: "http://127.0.0.1:8765/builders.json"
      max_age_days: 3
      max_items: 40

    # ---- 中文 AI / 产品 / 商业 ----
    - id: "qbitai"
      name: "量子位"
      url: "https://www.qbitai.com/feed"
      max_age_days: 3
    - id: "woshipm"
      name: "人人都是产品经理"
      url: "https://www.woshipm.com/feed"
      max_age_days: 4
    - id: "infoq-cn"
      name: "InfoQ 中文"
      url: "https://www.infoq.cn/feed"
      max_age_days: 3

    # ---- 中文媒体：替代已停用的 wewe-rss 公众号源 ----
    # 原来那批公众号走自建 wewe-rss（Railway 实例已删除），改用各家官网 RSS。
    # 公众号里「人人都是产品经理」「量子位」上面已有官网 RSS，不重复配置。
    - id: "36kr"
      name: "36氪"
      url: "https://www.36kr.com/feed"
      # 日期格式是 "2026-09-28 15:28:22  +0800"，非 RFC 2822，但 feedparser 能解析。
      max_age_days: 2
    - id: "geekpark"
      name: "极客公园"
      url: "https://www.geekpark.net/rss"
      max_age_days: 3
    - id: "aiera"
      name: "新智元"
      url: "https://www.aiera.com.cn/feed"
      max_age_days: 3
    - id: "huxiu"
      name: "虎嗅"
      # 虎嗅官网 RSS（huxiu.com/rss/0.xml）已返回 403，改走 RSSHub 公共镜像。
      # 镜像属第三方，若某天失败只剩这一路，换 rsshub.app/huxiu/article 即可。
      url: "https://rsshub.rssforever.com/huxiu/article"
      max_age_days: 3
    - id: "growthbox"
      name: "增长黑盒"
      url: "https://www.growthbox.net/feed"
      # 双月更，窗口必须开大，否则整栏为空。
      max_age_days: 60

    # ---- 英文一手源 ----
    - id: "techcrunch-ai"
      name: "TechCrunch AI"
      url: "https://techcrunch.com/category/artificial-intelligence/feed/"
      max_age_days: 3
    - id: "lennys-newsletter"
      name: "Lenny's Newsletter"
      url: "https://www.lennysnewsletter.com/feed"
      max_age_days: 10
    - id: "latent-space"
      name: "Latent Space"
      url: "https://www.latent.space/feed"
      max_age_days: 10
    - id: "hacker-news"
      name: "Hacker News"
      url: "https://hnrss.org/frontpage"
      max_age_days: 2

report:
  mode: "current"
  display_mode: "keyword"
  sort_by_position_first: true
  rank_threshold: 5
  max_news_per_keyword: 0  # Shared limits apply only after API/RSS merging.

filter:
  method: "keyword"
  priority_sort_enabled: true

ai_filter:
  batch_size: 120
  batch_interval: 2
  min_score: 0.70
  reclassify_threshold: 0.6
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"

display:
  region_order:
    - hotlist
    - ai_analysis
  regions:
    hotlist: true
    new_items: false
    rss: true  # Required for ingestion; items merge before rendering.
    standalone: false
    ai_analysis: true
  standalone:
    platforms: []
    rss_feeds: []
    max_items: 0

notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ""
    dingtalk:
      webhook_url: ""
    wework:
      webhook_url: ""
      msg_type: "markdown"
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: "1441469055@qq.com"
      password: ""
      to: "1441469055@qq.com"
      smtp_server: "smtp.qq.com"
      smtp_port: "465"
    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""
    bark:
      url: ""
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""

storage:
  backend: "local"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 7
  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""
  pull:
    enabled: false
    days: 7

ai:
  model: "deepseek/deepseek-v4-flash"
  api_key: ""
  api_base: ""
  timeout: 120
  temperature: 1.0
  max_tokens: 3000
  num_retries: 1
  fallback_models: []

ai_analysis:
  enabled: true
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "current"
  max_news_for_analysis: 22
  include_rss: false  # Already included in the unified stats.
  include_standalone: false
  include_rank_timeline: false

ai_translation:
  enabled: true
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"
  scope:
    hotlist: true  # Translate English titles in the unified list.
    rss: false
    standalone: false

advanced:
  debug: false
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
